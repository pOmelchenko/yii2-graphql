name: CI

on:
  push:
    branches: [ master ]
    tags: [ '[0-9]*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.0'
            coverage: none
            supported: true
            dependencies: lowest
          - php-version: '8.0'
            coverage: xdebug
            supported: true
          - php-version: '8.1'
            coverage: xdebug
            supported: true
          - php-version: '8.2'
            coverage: xdebug
            supported: true
          - php-version: '8.3'
            coverage: xdebug
            supported: true
          - php-version: '8.4'
            coverage: xdebug
            supported: false
            skip_reason: laminas/laminas-diactoros supports PHP 8.3 and below
          - php-version: '8.5'
            coverage: none
            supported: false
            skip_reason: laminas/laminas-diactoros supports PHP 8.3 and below
    env:
      COVERAGE_DIR: coverage
    steps:
      - uses: actions/checkout@v3
      - name: Skip unsupported PHP version
        if: matrix.supported == false
        run: |
          echo "::notice::Skipping PHP ${{ matrix.php-version }}: ${{ matrix.skip_reason }}"
      - name: Setup PHP
        if: matrix.supported == true
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: ${{ matrix.coverage }}
      - name: Validate composer files
        if: matrix.supported == true
        run: composer validate --strict
      - name: Install dependencies
        if: matrix.supported == true
        run: |
          # Compatibility tests for webonyx 14; these upstream issues remain unresolved (see UPGRADE.md).
          # Scope exceptions to resolution only: composer audit must continue to report them.
          composer config --global --json audit.ignore '{
            "PKSA-xwpn-zs9j-6wy5": {"apply": "block", "reason": "webonyx 14 compatibility CI only"},
            "PKSA-sf9j-1gs7-xzvx": {"apply": "block", "reason": "webonyx 14 compatibility CI only"},
            "PKSA-7h5p-prw9-w5nr": {"apply": "block", "reason": "webonyx 14 compatibility CI only"}
          }'
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction
          else
            composer install --prefer-dist --no-progress --no-interaction
          fi
      - name: Report resolved dependency versions
        if: matrix.supported == true && matrix.dependencies == 'lowest'
        run: composer show --direct
      - name: Report dependency security advisories
        if: matrix.supported == true
        continue-on-error: true
        run: composer audit --locked
      - name: Run PHP_CodeSniffer
        if: matrix.supported == true && matrix.dependencies != 'lowest'
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: Run PHPStan
        if: matrix.supported == true
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
      - name: Run tests with coverage
        if: matrix.supported == true && matrix.coverage == 'xdebug'
        run: |
          mkdir -p "$COVERAGE_DIR"
          XDEBUG_MODE=coverage vendor/bin/phpunit \
            --verbose \
            --configuration phpunit.xml.dist \
            --coverage-text="$COVERAGE_DIR/coverage.txt" \
            --coverage-clover="$COVERAGE_DIR/clover.xml"
      - name: Run tests
        if: matrix.supported == true && matrix.coverage != 'xdebug'
        run: vendor/bin/phpunit --verbose --configuration phpunit.xml.dist
      - name: Run Infection mutation tests
        if: matrix.supported == true && matrix.coverage == 'xdebug'
        run: composer mutation
      - name: Upload coverage to Codecov
        if: matrix.supported == true && matrix.coverage == 'xdebug' && success()
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.COVERAGE_DIR }}/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Publish coverage summary
        if: matrix.supported == true && matrix.coverage == 'xdebug' && success()
        run: |
          echo "## Code coverage" >> $GITHUB_STEP_SUMMARY
          cat "$COVERAGE_DIR/coverage.txt" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        if: matrix.supported == true && matrix.coverage == 'xdebug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php-${{ matrix.php-version }}
          path: ${{ env.COVERAGE_DIR }}
      - name: Upload Infection logs artifact
        if: matrix.supported == true && matrix.coverage == 'xdebug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-logs-php-${{ matrix.php-version }}
          path: build/infection
          if-no-files-found: ignore
